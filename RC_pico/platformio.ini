; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
platform_packages =
	toolchain-rp2040-earlephilhower @ file://./toolchain-cache/x86_64-w64-mingw32.arm-none-eabi-1aec55e.250530.zip
	tool-picotool-rp2040-earlephilhower @ file://./toolchain-cache/x86_64-w64-mingw32.picotool-c56c005.250530.zip
	tool-pioasm-rp2040-earlephilhower @ file://./toolchain-cache/x86_64-w64-mingw32.pioasm-9fdfe11.250530.zip
	tool-openocd-rp2040-earlephilhower @ file://./toolchain-cache/x86_64-w64-mingw32.openocd-ebec9504d.250530.zip
	tool-mklittlefs-rp2040-earlephilhower @ file://./toolchain-cache/x86_64-w64-mingw32.mklittlefs-db0513a.250530.zip
	
[env:moving]
build_src_filter = +<moving.cpp>
lib_deps = 
	coryjfowler/mcp_can@^1.5.1
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6

[env:main]
build_src_filter = +<main.cpp>
lib_deps = 
	coryjfowler/mcp_can@^1.5.1
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6

[env:enc]
build_src_filter = +<enc.cpp>
lib_deps = 
	coryjfowler/mcp_can@^1.5.1
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6

[env:troll]
build_src_filter = +<troll.cpp>
lib_deps =
	coryjfowler/mcp_can@^1.5.1
	adafruit/Adafruit SSD1306@^2.5.15